<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockroom – Inventory Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef2f1; --surface:#ffffff; --ink:#18282c; --muted:#5d6f73; --line:#d3dcdb;
  --accent:#0f766e; --accent-ink:#ffffff; --warn:#b45309; --warn-bg:#fdf0dc; --danger:#b42318;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10191b; --surface:#18262a; --ink:#e6eeed; --muted:#93a8ab; --line:#2c3f43;
    --accent:#2dd4bf; --accent-ink:#06211d; --warn:#f5b04c; --warn-bg:#3a2b12; --danger:#ff8a7a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10191b; --surface:#18262a; --ink:#e6eeed; --muted:#93a8ab; --line:#2c3f43;
  --accent:#2dd4bf; --accent-ink:#06211d; --warn:#f5b04c; --warn-bg:#3a2b12; --danger:#ff8a7a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:4px 0 20px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stats div{min-width:110px}
.stats b{display:block;font-size:1.6rem;font-weight:800}
.stats span{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:1.05rem;margin:0 0 12px}
label{display:block;font-size:.88rem;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:8px 0 0}
.btns{display:flex;gap:8px;margin-top:12px}
button{font:inherit;font-weight:600;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.small{padding:5px 10px;font-size:.85rem}
.search{margin-bottom:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.low{background:var(--warn-bg)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 8px;margin-left:6px}
.actions{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.editing{outline:2px solid var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stockroom</h1>
  <p class="sub">Add, edit, delete and search your products. Data stays in this browser.</p>

  <div class="stats" aria-live="polite">
    <div><b id="sProducts">0</b><span>Products</span></div>
    <div><b id="sUnits">0</b><span>Units in stock</span></div>
    <div><b id="sValue">0</b><span>Stock value</span></div>
    <div><b id="sLow">0</b><span>Low stock (5 or fewer)</span></div>
  </div>

  <div class="layout">
    <section class="panel" id="formPanel">
      <h2 id="formTitle">Add product</h2>
      <form id="form" novalidate>
        <label for="name">Product name</label>
        <input id="name" maxlength="60" autocomplete="off">
        <label for="category">Category</label>
        <select id="category">
          <option>Electronics</option><option>Office</option><option>Clothing</option><option>Food</option><option>Other</option>
        </select>
        <div class="row">
          <div><label for="qty">Quantity</label><input id="qty" type="number" min="0" step="1"></div>
          <div><label for="price">Price</label><input id="price" type="number" min="0" step="0.01"></div>
        </div>
        <p class="err" id="err" role="alert"></p>
        <div class="btns">
          <button type="submit" class="primary" id="saveBtn">Add product</button>
          <button type="button" id="cancelBtn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <input class="search" id="search" type="search" placeholder="Search by name or category" aria-label="Search products">
      <div class="tablewrap">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th class="num">Qty</th><th class="num">Price</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden></div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  var KEY = "stockroom-items";
  var items = [];
  var editId = null;

  var seed = [
    {id: 1, name: "Wireless mouse", category: "Electronics", qty: 24, price: 18.5},
    {id: 2, name: "A4 notebook", category: "Office", qty: 4, price: 3.2},
    {id: 3, name: "Cotton t-shirt", category: "Clothing", qty: 40, price: 9.99}
  ];

  try {
    var saved = localStorage.getItem(KEY);
    items = saved ? JSON.parse(saved) : seed;
    if (!Array.isArray(items)) items = seed;
  } catch (e) { items = seed; }

  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n){ return Number(n).toFixed(2); }

  function render(){
    var q = $("search").value.trim().toLowerCase();
    var list = items.filter(function(it){
      return it.name.toLowerCase().indexOf(q) > -1 || it.category.toLowerCase().indexOf(q) > -1;
    });
    $("rows").innerHTML = list.map(function(it){
      var low = it.qty <= 5;
      return '<tr class="' + (low ? "low" : "") + (it.id === editId ? " editing" : "") + '">' +
        '<td>' + esc(it.name) + (low ? '<span class="tag">Low</span>' : "") + '</td>' +
        '<td>' + esc(it.category) + '</td>' +
        '<td class="num">' + it.qty + '</td>' +
        '<td class="num">' + money(it.price) + '</td>' +
        '<td><div class="actions">' +
          '<button class="small" data-edit="' + it.id + '">Edit</button>' +
          '<button class="small danger" data-del="' + it.id + '">Delete</button>' +
        '</div></td></tr>';
    }).join("");
    var empty = $("empty");
    if (!list.length) {
      empty.hidden = false;
      empty.textContent = items.length ? "No products match your search. Try another name or category." : "No products yet. Add your first product using the form.";
    } else { empty.hidden = true; }

    var units = items.reduce(function(s,i){ return s + i.qty; }, 0);
    var value = items.reduce(function(s,i){ return s + i.qty * i.price; }, 0);
    $("sProducts").textContent = items.length;
    $("sUnits").textContent = units;
    $("sValue").textContent = value.toFixed(2);
    $("sLow").textContent = items.filter(function(i){ return i.qty <= 5; }).length;
  }

  function resetForm(){
    editId = null;
    $("form").reset();
    $("err").textContent = "";
    $("formTitle").textContent = "Add product";
    $("saveBtn").textContent = "Add product";
    $("cancelBtn").hidden = true;
  }

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("name").value.trim();
    var qty = parseInt($("qty").value, 10);
    var price = parseFloat($("price").value);
    if (!name) { $("err").textContent = "Enter a product name."; return; }
    if (isNaN(qty) || qty < 0) { $("err").textContent = "Enter a quantity of 0 or more."; return; }
    if (isNaN(price) || price < 0) { $("err").textContent = "Enter a price of 0 or more."; return; }
    var data = {name: name, category: $("category").value, qty: qty, price: price};
    if (editId !== null) {
      items = items.map(function(it){ return it.id === editId ? Object.assign({id: it.id}, data) : it; });
    } else {
      var nextId = items.reduce(function(m,i){ return Math.max(m, i.id); }, 0) + 1;
      items.push(Object.assign({id: nextId}, data));
    }
    persist(); resetForm(); render();
  });

  $("cancelBtn").addEventListener("click", function(){ resetForm(); render(); });
  $("search").addEventListener("input", render);

  $("rows").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.edit) {
      var id = Number(b.dataset.edit);
      var it = items.filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      editId = id;
      $("name").value = it.name; $("category").value = it.category;
      $("qty").value = it.qty; $("price").value = it.price;
      $("formTitle").textContent = "Edit product";
      $("saveBtn").textContent = "Save changes";
      $("cancelBtn").hidden = false;
      $("err").textContent = "";
      $("formPanel").scrollIntoView({behavior: "smooth", block: "start"});
      $("name").focus();
      render();
    } else if (b.dataset.del) {
      var did = Number(b.dataset.del);
      var target = items.filter(function(x){ return x.id === did; })[0];
      if (target && window.confirm("Delete " + target.name + "?")) {
        items = items.filter(function(x){ return x.id !== did; });
        if (editId === did) resetForm();
        persist(); render();
      }
    }
  });

  render();
})();
</script>
</body>
  </html>
